
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#160d08;color:white;font-family:sans-serif;padding:20px}
button{padding:14px;margin:5px;border-radius:8px}
.card{background:white;color:black}
.box{border:1px solid #777;padding:15px;margin:10px}
</style>
</head>
<body>

<h1>群友杀 v7.1 可玩版</h1>

<div class="box">
<button onclick="single()">单机AI</button>
<button onclick="createRoom()">创建房间</button>
<input id="rid" placeholder="房间号">
<button onclick="joinRoom()">加入</button>
</div>

<div class="box">
<h2 id="hero">等待开始</h2>
<div>你的HP:<span id="myhp">-</span></div>
<div>AI HP:<span id="aihp">-</span></div>
</div>

<div class="box">
<h3>手牌</h3>
<button class="card" onclick="play('杀')">杀</button>
<button class="card" onclick="play('桃')">桃</button>
</div>

<div class="box">
<h3>DIY中心</h3>
<button onclick="alert('武将编辑器将在下一版开启')">创建武将</button>
<button onclick="alert('技能编辑器将在下一版开启')">技能编辑</button>
</div>

<pre id="log"></pre>

<script>
let ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);

ws.onmessage=e=>{
 let d=JSON.parse(e.data);
 if(d.game){
  myhp.innerText=d.game.you.hp;
  aihp.innerText=d.game.ai.hp;
  hero.innerText=d.game.you.hero+" VS "+d.game.ai.hero;
 }
 if(d.text||d.id||d.type==="log")
  log.textContent+=(d.text||("房间:"+d.id))+"\\n";
};

function single(){
 ws.send(JSON.stringify({type:"single"}));
}

function play(c){
 ws.send(JSON.stringify({type:"play",card:c}));
}

function createRoom(){
 ws.send(JSON.stringify({type:"create"}));
}

function joinRoom(){
 ws.send(JSON.stringify({type:"join",id:rid.value}));
}

function log(t){
 document.getElementById("log").textContent+=t+"\\n";
}
</script>

</body>
</html>
